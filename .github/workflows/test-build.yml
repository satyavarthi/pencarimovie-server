name: Test Release Build & Installers

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, master, 'codex/**']
    paths:
      - "pencarimovie-linux.sh"
      - "pencarimovie-termux.sh"
      - "backend.php"
      - "public/**"
      - "public/index.html"
      - "scripts/**"
      - ".github/workflows/test-build.yml"
      - "pencarimovie-windows.bat"
      - "update.ps1"
      - "Dockerfile"
      - "docker-compose.yml"

jobs:
  test-installers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PHP
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-curl php-mbstring

      - name: Validate PHP syntax
        run: |
          php -l backend.php
          php -l router.php
          php -l index.php

      - name: Test Linux Shell Installer Syntax & Target Detection
        run: |
          chmod +x pencarimovie-linux.sh
          bash -n pencarimovie-linux.sh
          echo "Target detection on $(uname -s) $(uname -m):"
          PENCARIMOVIE_NO_BANNER=1 bash -c 'source ./pencarimovie-linux.sh; detect_target'

      - name: Test Termux Shell Installer Syntax
        run: |
          chmod +x pencarimovie-termux.sh
          bash -n pencarimovie-termux.sh

      - name: Verify upstream-core/custom-UI separation
        run: |
          grep -q 'REPO="aiskendi/pencarimovie-server"' pencarimovie-linux.sh
          grep -q 'CUSTOM_REPO="satyavarthi/pencarimovie-server"' pencarimovie-linux.sh
          grep -q 'REPO=aiskendi/pencarimovie-server' pencarimovie-windows.bat
          grep -q 'CUSTOM_REPO=satyavarthi/pencarimovie-server' pencarimovie-windows.bat
          grep -q 'CustomRepo' update.ps1
          grep -q 'UPSTREAM_REPO=aiskendi/pencarimovie-server' Dockerfile
          grep -q 'Overlaying repository-owned UI only' Dockerfile

      - name: Test Server Boot & Manifest Response (Native PHP Mode)
        run: |
          PORT=8099 php -S 127.0.0.1:8099 router.php > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          sleep 3

          echo "Testing HTTP response..."
          HTTP_CODE=$(curl -s -o /tmp/manifest.json -w "%{http_code}" http://127.0.0.1:8099/manifest.json || echo "000")
          echo "Response code: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Server failed to return 200 OK for /manifest.json"
            cat /tmp/server.log
            kill $SERVER_PID || true
            exit 1
          fi

          echo "Manifest returned successfully:"
          head -n 20 /tmp/manifest.json
          kill $SERVER_PID || true
